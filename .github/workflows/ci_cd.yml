name: Nexo Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        env:
          POSTGRES_DB: nexo_db
          POSTGRES_USER: nexo_user
          POSTGRES_PASSWORD: nexo_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js v20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Build Admin Panel Web UI
        run: |
          cd admin_frontend
          npm ci
          npm run build

      - name: Build Docker Container Images
        run: |
          docker build -t nexo-backend:latest ./backend
          docker build -t nexo-admin-frontend:latest ./admin_frontend
          docker build -t nexo-ml-service:latest ./ml_service
