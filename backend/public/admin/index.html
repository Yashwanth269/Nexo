<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Admin CMS Dashboard — AI Prompt & Asset Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nexo: {
                            orange: '#F97316',
                            dark: '#0F172A',
                            card: '#1E293B',
                            border: '#334155',
                            accent: '#FF6A00'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #F8FAFC; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0F172A; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col custom-scrollbar">

    <!-- Top Navigation Header -->
    <header class="glass-panel sticky top-0 z-40 px-6 py-4 border-b border-nexo-border flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-nexo-orange to-amber-500 flex items-center justify-center shadow-lg shadow-nexo-orange/20">
                <i class="fa-solid fa-bolt text-white text-xl"></i>
            </div>
            <div>
                <h1 class="font-outfit text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    Nexo Admin CMS <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-nexo-orange/20 text-nexo-orange border border-nexo-orange/30">Zero Auth Mode</span>
                </h1>
                <p class="text-xs text-slate-400">AI Prompt Library, Gemini Asset Engine & Banner Manager</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="triggerBatchRegeneration()" id="batchGenBtn" class="px-4 py-2 bg-gradient-to-r from-nexo-orange to-amber-500 hover:opacity-90 text-white text-sm font-semibold rounded-xl shadow-lg shadow-nexo-orange/20 transition-all flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate All Categories
            </button>
            <button onclick="loadAllPrompts()" class="px-3.5 py-2 glass-panel hover:bg-slate-700/50 text-slate-200 text-sm font-medium rounded-xl border border-nexo-border transition-all flex items-center gap-2">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

        <!-- Stats Bar -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="glass-panel p-5 rounded-2xl flex items-center justify-between border border-nexo-border">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Master Prompts Seeded</p>
                    <h3 id="statPromptsCount" class="text-2xl font-bold text-white font-outfit mt-1">179</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-book-bookmark"></i>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-2xl flex items-center justify-between border border-nexo-border">
                <div>
                    <p class="text-xs text-slate-400 font-medium">AI Images Ready</p>
                    <h3 id="statReadyCount" class="text-2xl font-bold text-emerald-400 font-outfit mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-2xl flex items-center justify-between border border-nexo-border">
                <div>
                    <p class="text-xs text-slate-400 font-medium">AI Generator Engine</p>
                    <h3 class="text-lg font-bold text-nexo-orange font-outfit mt-1">Nano Banana 2 Lite</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-nexo-orange/10 border border-nexo-orange/20 text-nexo-orange flex items-center justify-center text-lg">
                    <i class="fa-solid fa-robot"></i>
                </div>
            </div>

            <div class="glass-panel p-5 rounded-2xl flex items-center justify-between border border-nexo-border">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Zero-Downtime Guard</p>
                    <h3 class="text-lg font-bold text-sky-400 font-outfit mt-1">ACTIVE</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/20 text-sky-400 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
            </div>
        </div>

        <!-- Controls Header: Search & Filter -->
        <div class="glass-panel p-4 rounded-2xl flex flex-col md:flex-row items-center justify-between gap-4 border border-nexo-border">
            <div class="relative flex-1 w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="filterPrompts()" placeholder="Search profession, category, tool, or subcategory..." class="w-full pl-11 pr-4 py-2.5 bg-slate-900/60 border border-nexo-border rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-nexo-orange transition-all">
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto">
                <select id="categoryFilter" onchange="filterPrompts()" class="px-4 py-2.5 bg-slate-900/60 border border-nexo-border rounded-xl text-sm text-slate-200 focus:outline-none focus:border-nexo-orange">
                    <option value="ALL">All Vertical Categories</option>
                </select>

                <select id="statusFilter" onchange="filterPrompts()" class="px-4 py-2.5 bg-slate-900/60 border border-nexo-border rounded-xl text-sm text-slate-200 focus:outline-none focus:border-nexo-orange">
                    <option value="ALL">All Image Statuses</option>
                    <option value="READY">READY</option>
                    <option value="DEFAULT">DEFAULT / FALLBACK</option>
                    <option value="GENERATING">GENERATING</option>
                    <option value="REJECTED">REJECTED</option>
                </select>
            </div>
        </div>

        <!-- Category Grid -->
        <div id="promptsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <!-- Cards populated dynamically -->
        </div>

    </main>

    <!-- Version History Modal -->
    <div id="versionModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass-panel max-w-2xl w-full rounded-2xl border border-nexo-border overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
            <div class="px-6 py-4 border-b border-nexo-border flex items-center justify-between bg-slate-900/40">
                <h3 class="font-outfit text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-nexo-orange"></i> Asset Version History
                </h3>
                <button onclick="closeVersionModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="versionModalContent" class="p-6 space-y-4 overflow-y-auto custom-scrollbar flex-1">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Edit Prompt Modal -->
    <div id="editPromptModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="glass-panel max-w-xl w-full rounded-2xl border border-nexo-border overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-nexo-border flex items-center justify-between bg-slate-900/40">
                <h3 class="font-outfit text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-nexo-orange"></i> Edit Master Prompt Configuration
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="p-6 space-y-4">
                <input type="hidden" id="editSubcatId">

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Profession Job Title</label>
                    <input type="text" id="editJobTitle" class="w-full px-4 py-2.5 bg-slate-900/80 border border-nexo-border rounded-xl text-sm text-white focus:outline-none focus:border-nexo-orange">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Held Tool / Equipment</label>
                    <input type="text" id="editJobTool" class="w-full px-4 py-2.5 bg-slate-900/80 border border-nexo-border rounded-xl text-sm text-white focus:outline-none focus:border-nexo-orange">
                </div>

                <div class="pt-4 flex items-center justify-end gap-3 border-t border-nexo-border">
                    <button onclick="closeEditModal()" class="px-4 py-2 rounded-xl border border-nexo-border text-sm text-slate-300 hover:bg-slate-800">Cancel</button>
                    <button onclick="saveEditedPrompt()" class="px-5 py-2 bg-nexo-orange hover:bg-nexo-accent text-white font-semibold text-sm rounded-xl shadow-lg shadow-nexo-orange/20">Save & Lock Prompt</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <script>
        let allPrompts = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadAllPrompts();
        });

        async function loadAllPrompts() {
            try {
                const res = await fetch('/api/admin/cms/ai-assets/prompts');
                const data = await res.json();

                if (data.success) {
                    allPrompts = data.prompts;
                    updateStats();
                    populateCategoryFilter();
                    renderPromptsGrid(allPrompts);
                } else {
                    showToast('Failed to load master prompts', 'error');
                }
            } catch (err) {
                console.error(err);
                showToast('Error connecting to backend API', 'error');
            }
        }

        function updateStats() {
            document.getElementById('statPromptsCount').textContent = allPrompts.length;
            const readyCount = allPrompts.filter(p => p.current_status === 'READY').length;
            document.getElementById('statReadyCount').textContent = readyCount;
        }

        function populateCategoryFilter() {
            const select = document.getElementById('categoryFilter');
            const categories = [...new Set(allPrompts.map(p => p.category_name))].sort();
            
            select.innerHTML = '<option value="ALL">All Vertical Categories</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function filterPrompts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;

            const filtered = allPrompts.filter(p => {
                const matchesSearch = !search || 
                    p.subcategory_name.toLowerCase().includes(search) || 
                    p.category_name.toLowerCase().includes(search) ||
                    p.job_tool.toLowerCase().includes(search);

                const matchesCat = cat === 'ALL' || p.category_name === cat;
                const matchesStatus = status === 'ALL' || 
                    (status === 'READY' && p.current_status === 'READY') ||
                    (status === 'DEFAULT' && p.current_status === 'DEFAULT') ||
                    (status === 'GENERATING' && p.current_status === 'GENERATING') ||
                    (status === 'REJECTED' && p.current_status === 'REJECTED');

                return matchesSearch && matchesCat && matchesStatus;
            });

            renderPromptsGrid(filtered);
        }

        function renderPromptsGrid(prompts) {
            const grid = document.getElementById('promptsGrid');
            if (prompts.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center p-12 glass-panel rounded-2xl text-slate-400">No matching subcategories or master prompts found.</div>`;
                return;
            }

            grid.innerHTML = prompts.map(p => {
                const isReady = p.current_status === 'READY';
                const statusBadgeClass = isReady ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' :
                    (p.current_status === 'GENERATING' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30 animate-pulse' :
                    (p.current_status === 'REJECTED' ? 'bg-rose-500/10 text-rose-400 border-rose-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'));

                const imageUrl = p.current_image || '/assets/images/home services/electrical/wiring.webp';

                return `
                <div class="glass-panel rounded-2xl p-5 border border-nexo-border flex flex-col justify-between hover:border-nexo-orange/40 transition-all group">
                    <div>
                        <!-- Header Badges -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                                ${p.category_name}
                            </span>
                            <span class="text-[11px] font-bold px-2.5 py-1 rounded-full border ${statusBadgeClass} uppercase">
                                v${p.current_version} • ${p.current_status}
                            </span>
                        </div>

                        <!-- Image Preview & Subcat Name -->
                        <div class="flex items-center gap-4 my-2">
                            <div class="w-16 h-16 rounded-xl bg-slate-900 border border-nexo-border overflow-hidden flex-shrink-0 flex items-center justify-center relative">
                                <img src="${imageUrl}" alt="${p.subcategory_name}" class="w-full h-full object-cover" onerror="this.src='/assets/images/home services/electrical/wiring.webp'">
                            </div>
                            <div>
                                <h4 class="font-outfit font-bold text-base text-white group-hover:text-nexo-orange transition-colors">
                                    ${p.subcategory_name}
                                </h4>
                                <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1.5">
                                    <i class="fa-solid fa-screwdriver-wrench text-nexo-orange"></i> ${p.job_tool}
                                </p>
                            </div>
                        </div>

                        <!-- Master Prompt Summary -->
                        <div class="mt-4 p-3 bg-slate-900/60 rounded-xl border border-slate-800 text-xs text-slate-300 space-y-1">
                            <p class="font-mono text-[11px] text-slate-400 line-clamp-2">
                                ${p.master_prompt}
                            </p>
                        </div>
                    </div>

                    <!-- Action Footer -->
                    <div class="mt-5 pt-4 border-t border-slate-800 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-1.5">
                            <button onclick="openEditModal('${p.subcategory_id}', '${escapeHtml(p.job_title)}', '${escapeHtml(p.job_tool)}')" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg text-xs" title="Edit Prompt">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="viewVersionHistory('${p.subcategory_id}')" class="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg text-xs" title="Version History">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                            </button>
                        </div>

                        <button onclick="generateImageForSubcat('${p.subcategory_id}', this)" class="px-3.5 py-1.5 bg-nexo-orange hover:bg-nexo-accent text-white font-semibold text-xs rounded-xl shadow-md shadow-nexo-orange/20 transition-all flex items-center gap-1.5">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate / Retry
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function generateImageForSubcat(subcatId, btnElement) {
            const originalText = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Generating...`;

            try {
                const res = await fetch('/api/admin/cms/ai-assets/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subcategoryId: subcatId })
                });

                const data = await res.json();
                if (data.success) {
                    showToast(`Generated asset version v${data.version} successfully!`, 'success');
                    await loadAllPrompts();
                } else {
                    showToast(`Generation output: ${data.message || data.error}`, 'warning');
                    await loadAllPrompts();
                }
            } catch (err) {
                console.error(err);
                showToast('Error triggering asset generation', 'error');
            } finally {
                btnElement.disabled = false;
                btnElement.innerHTML = originalText;
            }
        }

        async function triggerBatchRegeneration() {
            const btn = document.getElementById('batchGenBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processing All...`;

            try {
                const res = await fetch('/api/admin/cms/ai-assets/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                const data = await res.json();
                if (data.success) {
                    showToast(`Processed batch regeneration for ${data.total} categories. Ready: ${data.successCount}`, 'success');
                    await loadAllPrompts();
                }
            } catch (e) {
                showToast('Batch regeneration encountered error', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Generate All Categories`;
            }
        }

        async function viewVersionHistory(subcatId) {
            const modal = document.getElementById('versionModal');
            const content = document.getElementById('versionModalContent');

            content.innerHTML = `<div class="text-center p-8 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i><p>Fetching version history...</p></div>`;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            try {
                const res = await fetch(`/api/admin/cms/ai-assets/versions/${subcatId}`);
                const data = await res.json();

                if (data.success && data.versions.length > 0) {
                    content.innerHTML = data.versions.map(v => `
                        <div class="p-4 bg-slate-900/60 rounded-xl border border-slate-800 flex items-center justify-between gap-4">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 rounded-lg bg-slate-950 border border-slate-800 overflow-hidden flex-shrink-0">
                                    <img src="${v.image_url}" class="w-full h-full object-cover" onerror="this.src='/assets/images/home services/electrical/wiring.webp'">
                                </div>
                                <div>
                                    <h5 class="text-sm font-bold text-white flex items-center gap-2">
                                        Version v${v.version} <span class="text-[10px] px-2 py-0.5 rounded-full ${v.approved ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${v.status}</span>
                                    </h5>
                                    <p class="text-xs text-slate-400 mt-0.5">${new Date(v.created_at).toLocaleString()}</p>
                                    <p class="text-[11px] font-mono text-slate-500 mt-1">${v.image_url}</p>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = `<div class="text-center p-8 text-slate-400">No version history recorded yet. Generating the first asset version will create v1.</div>`;
                }
            } catch (err) {
                content.innerHTML = `<div class="text-center p-8 text-rose-400">Failed to fetch version history.</div>`;
            }
        }

        function closeVersionModal() {
            const modal = document.getElementById('versionModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function openEditModal(subcatId, jobTitle, jobTool) {
            document.getElementById('editSubcatId').value = subcatId;
            document.getElementById('editJobTitle').value = jobTitle;
            document.getElementById('editJobTool').value = jobTool;

            const modal = document.getElementById('editPromptModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEditModal() {
            const modal = document.getElementById('editPromptModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function saveEditedPrompt() {
            const subcategoryId = document.getElementById('editSubcatId').value;
            const jobTitle = document.getElementById('editJobTitle').value;
            const jobTool = document.getElementById('editJobTool').value;

            try {
                const res = await fetch('/api/admin/cms/ai-assets/prompts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subcategoryId, jobTitle, jobTool })
                });

                const data = await res.json();
                if (data.success) {
                    showToast('Master prompt updated & locked successfully!', 'success');
                    closeEditModal();
                    await loadAllPrompts();
                } else {
                    showToast(data.error || 'Failed to update prompt', 'error');
                }
            } catch (err) {
                showToast('Network error while saving prompt', 'error');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const colorClass = type === 'success' ? 'border-emerald-500 text-emerald-300 bg-slate-900/90' :
                (type === 'error' ? 'border-rose-500 text-rose-300 bg-slate-900/90' : 'border-nexo-orange text-amber-300 bg-slate-900/90');

            toast.className = `glass-panel px-4 py-3 rounded-xl border text-sm shadow-xl flex items-center gap-3 transition-all duration-300 translate-y-2 opacity-0 ${colorClass}`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check text-emerald-400' : (type === 'error' ? 'fa-triangle-exclamation text-rose-400' : 'fa-circle-info text-nexo-orange')}"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function escapeHtml(str) {
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
