<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexo Admin CMS Dashboard — AI Prompt & Asset Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Standalone Core CSS System (Guarantees Premium Styling even without CDN) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: #0B0F19; color: #F1F5F9; line-height: 1.5; padding-bottom: 40px; }
        
        .header-bar { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #1E293B; position: sticky; top: 0; z-index: 40; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
        .brand-badge { display: flex; align-items: center; gap: 12px; }
        .logo-box { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #F97316, #EA580C); display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; box-shadow: 0 4px 14px rgba(249, 115, 22, 0.3); }
        
        .btn-primary { background: linear-gradient(135deg, #F97316, #EA580C); color: white; border: none; padding: 9px 18px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25); }
        .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-secondary { background: #1E293B; color: #E2E8F0; border: 1px solid #334155; padding: 9px 16px; border-radius: 10px; font-weight: 500; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-secondary:hover { background: #334155; }
        
        .container { max-width: 1280px; margin: 24px auto; padding: 0 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #111827; border: 1px solid #1F2937; border-radius: 16px; padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; }
        .stat-label { font-size: 12px; color: #9CA3AF; font-weight: 500; }
        .stat-value { font-size: 24px; font-weight: 700; color: #F9FAFB; font-family: 'Outfit', sans-serif; margin-top: 4px; }
        
        .filter-bar { background: #111827; border: 1px solid #1F2937; border-radius: 16px; padding: 14px; display: flex; flex-wrap: wrap; items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
        .search-field { flex: 1; min-width: 260px; background: #0B0F19; border: 1px solid #374151; border-radius: 10px; padding: 9px 14px; color: white; font-size: 13px; outline: none; }
        .search-field:focus { border-color: #F97316; }
        .select-field { background: #0B0F19; border: 1px solid #374151; border-radius: 10px; padding: 9px 14px; color: #E5E7EB; font-size: 13px; outline: none; }
        
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 20px; }
        .asset-card { background: #111827; border: 1px solid #1F2937; border-radius: 16px; padding: 18px; display: flex; flex-col: column; justify-content: space-between; transition: all 0.2s; }
        .asset-card:hover { border-color: rgba(249, 115, 22, 0.4); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        
        .thumb-box { width: 72px; height: 72px; border-radius: 12px; background: #030712; border: 1px solid #374151; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .thumb-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .status-badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-ready { background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-generating { background: rgba(245, 158, 11, 0.15); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-rejected { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-default { background: #1F2937; color: #9CA3AF; border: 1px solid #374151; }
        
        details summary { font-size: 11px; font-weight: 600; color: #9CA3AF; cursor: pointer; padding: 6px 0; outline: none; user-select: none; }
        details summary:hover { color: #F97316; }
        details[open] summary { color: #F97316; }
        
        .prompt-preview-box { background: #030712; border: 1px solid #1F2937; border-radius: 10px; padding: 10px; font-family: monospace; font-size: 11px; color: #D1D5DB; max-height: 160px; overflow-y: auto; white-space: pre-wrap; margin-top: 6px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #111827; border: 1px solid #374151; border-radius: 20px; max-width: 600px; width: 100%; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 60; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #111827; border: 1px solid #374151; border-radius: 12px; padding: 12px 18px; font-size: 13px; color: white; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="header-bar">
        <div class="brand-badge">
            <div class="logo-box">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div>
                <h1 style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; color: white;">
                    Nexo Admin CMS <span style="font-size: 10px; background: rgba(249, 115, 22, 0.2); color: #F97316; border: 1px solid rgba(249, 115, 22, 0.4); padding: 2px 8px; border-radius: 20px; margin-left: 6px;">Zero Auth Mode</span>
                </h1>
                <p style="font-size: 11px; color: #9CA3AF;">AI Prompt Library & Gemini Asset Engine</p>
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <button onclick="triggerBatchRegeneration()" id="batchGenBtn" class="btn-primary">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generate All Categories
            </button>
            <button onclick="loadAllPrompts()" class="btn-secondary">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- Stats Bar -->
        <div class="stats-grid">
            <div class="stat-card">
                <div>
                    <div class="stat-label">Master Prompts Seeded</div>
                    <div id="statPromptsCount" class="stat-value">179</div>
                </div>
                <i class="fa-solid fa-book-bookmark" style="font-size: 24px; color: #3B82F6;"></i>
            </div>

            <div class="stat-card">
                <div>
                    <div class="stat-label">AI Images Ready</div>
                    <div id="statReadyCount" class="stat-value" style="color: #10B981;">0</div>
                </div>
                <i class="fa-solid fa-circle-check" style="font-size: 24px; color: #10B981;"></i>
            </div>

            <div class="stat-card">
                <div>
                    <div class="stat-label">AI Model Engine</div>
                    <div class="stat-value" style="color: #F97316; font-size: 18px;">Nano Banana 2 Lite</div>
                </div>
                <i class="fa-solid fa-robot" style="font-size: 24px; color: #F97316;"></i>
            </div>

            <div class="stat-card">
                <div>
                    <div class="stat-label">Zero-Downtime Guard</div>
                    <div class="stat-value" style="color: #38BDF8; font-size: 18px;">ACTIVE</div>
                </div>
                <i class="fa-solid fa-shield-halved" style="font-size: 24px; color: #38BDF8;"></i>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
            <input type="text" id="searchInput" oninput="filterPrompts()" placeholder="Search subcategory, category, or tool..." class="search-field">

            <div style="display: flex; gap: 10px;">
                <select id="categoryFilter" onchange="filterPrompts()" class="select-field">
                    <option value="ALL">All Vertical Categories</option>
                </select>

                <select id="statusFilter" onchange="filterPrompts()" class="select-field">
                    <option value="ALL">All Image Statuses</option>
                    <option value="READY">READY (AI Generated)</option>
                    <option value="DEFAULT">DEFAULT (Fallback Icon)</option>
                    <option value="GENERATING">GENERATING (Live In Progress)</option>
                    <option value="REJECTED">REJECTED (Quality Check Failed)</option>
                    <option value="FAILED">FAILED (API Quota/Error)</option>
                </select>
            </div>
        </div>

        <!-- Category Asset Cards Grid -->
        <div id="promptsGrid" class="cards-grid">
            <!-- Dynamically populated -->
        </div>

    </div>

    <!-- Version History Modal -->
    <div id="versionModal" class="modal-overlay">
        <div class="modal-card">
            <div style="padding: 16px 24px; border-bottom: 1px solid #374151; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700; color: white;">
                    <i class="fa-solid fa-clock-rotate-left" style="color: #F97316; margin-right: 6px;"></i> Asset Version History
                </h3>
                <button onclick="closeVersionModal()" style="background: none; border: none; color: #9CA3AF; font-size: 18px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="versionModalContent" style="padding: 20px; max-height: 400px; overflow-y: auto;">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Edit Master Prompt Modal -->
    <div id="editPromptModal" class="modal-overlay">
        <div class="modal-card">
            <div style="padding: 16px 24px; border-bottom: 1px solid #374151; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700; color: white;">
                    <i class="fa-solid fa-pen-to-square" style="color: #F97316; margin-right: 6px;"></i> Edit Master Prompt Configuration
                </h3>
                <button onclick="closeEditModal()" style="background: none; border: none; color: #9CA3AF; font-size: 18px; cursor: pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
                <input type="hidden" id="editSubcatId">
                <div>
                    <label style="font-size: 11px; font-weight: 700; color: #9CA3AF; text-transform: uppercase;">Profession Job Title</label>
                    <input type="text" id="editJobTitle" class="search-field" style="width: 100%; margin-top: 4px;">
                </div>
                <div>
                    <label style="font-size: 11px; font-weight: 700; color: #9CA3AF; text-transform: uppercase;">Held Tool / Equipment</label>
                    <input type="text" id="editJobTool" class="search-field" style="width: 100%; margin-top: 4px;">
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 12px; border-top: 1px solid #374151;">
                    <button onclick="closeEditModal()" class="btn-secondary">Cancel</button>
                    <button onclick="saveEditedPrompt()" class="btn-primary">Save & Lock Prompt</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script>
        let allPrompts = [];
        let autoPollTimer = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadAllPrompts();
            // Live status polling every 4 seconds for real-time monitoring
            autoPollTimer = setInterval(() => {
                loadAllPrompts(true);
            }, 4000);
        });

        async function loadAllPrompts(silent = false) {
            try {
                const res = await fetch('/api/admin/cms/ai-assets/prompts');
                const data = await res.json();

                if (data.success) {
                    allPrompts = data.prompts;
                    updateStats();
                    if (!silent) populateCategoryFilter();
                    filterPrompts();
                } else if (!silent) {
                    showToast('Failed to load master prompts', 'error');
                }
            } catch (err) {
                console.error(err);
                if (!silent) showToast('Error connecting to backend API', 'error');
            }
        }

        function updateStats() {
            document.getElementById('statPromptsCount').textContent = allPrompts.length;
            const readyCount = allPrompts.filter(p => p.current_status === 'READY').length;
            document.getElementById('statReadyCount').textContent = readyCount;
        }

        function populateCategoryFilter() {
            const select = document.getElementById('categoryFilter');
            const currentVal = select.value;
            const categories = [...new Set(allPrompts.map(p => p.category_name))].sort();
            
            select.innerHTML = '<option value="ALL">All Vertical Categories</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
            select.value = currentVal || 'ALL';
        }

        function filterPrompts() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const cat = document.getElementById('categoryFilter').value;
            const status = document.getElementById('statusFilter').value;

            const filtered = allPrompts.filter(p => {
                const matchesSearch = !search || 
                    p.subcategory_name.toLowerCase().includes(search) || 
                    p.category_name.toLowerCase().includes(search) ||
                    p.job_tool.toLowerCase().includes(search);

                const matchesCat = cat === 'ALL' || p.category_name === cat;
                const matchesStatus = status === 'ALL' || p.current_status === status;

                return matchesSearch && matchesCat && matchesStatus;
            });

            renderPromptsGrid(filtered);
        }

        function renderPromptsGrid(prompts) {
            const grid = document.getElementById('promptsGrid');
            if (prompts.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #9CA3AF; background: #111827; border-radius: 16px;">No matching subcategories or master prompts found.</div>`;
                return;
            }

            grid.innerHTML = prompts.map(p => {
                const isReady = p.current_status === 'READY';
                const statusBadgeClass = isReady ? 'badge-ready' :
                    (p.current_status === 'GENERATING' ? 'badge-generating' :
                    (p.current_status === 'REJECTED' ? 'badge-rejected' : 'badge-default'));

                const imageUrl = p.current_image || '/assets/images/home services/electrical/wiring.webp';

                return `
                <div class="asset-card">
                    <div>
                        <!-- Header Badges -->
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <span style="font-size: 11px; font-weight: 600; background: #1F2937; color: #D1D5DB; padding: 2px 10px; border-radius: 20px; border: 1px solid #374151;">
                                ${p.category_name}
                            </span>
                            <span class="status-badge ${statusBadgeClass}">
                                v${p.current_version} • ${p.current_status}
                            </span>
                        </div>

                        <!-- Thumbnail & Info -->
                        <div style="display: flex; gap: 14px; align-items: center; margin-bottom: 12px;">
                            <div class="thumb-box">
                                <img src="${imageUrl}" alt="${p.subcategory_name}" onerror="this.src='/assets/images/home services/electrical/wiring.webp'">
                            </div>
                            <div>
                                <h4 style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700; color: white;">
                                    ${p.subcategory_name}
                                </h4>
                                <p style="font-size: 12px; color: #9CA3AF; margin-top: 2px; display: flex; align-items: center; gap: 6px;">
                                    <i class="fa-solid fa-screwdriver-wrench" style="color: #F97316;"></i> ${p.job_tool}
                                </p>
                            </div>
                        </div>

                        <!-- Master Prompt Collapsible -->
                        <details>
                            <summary><i class="fa-solid fa-chevron-right" style="font-size: 9px; margin-right: 4px;"></i> View Locked Master Prompt (${p.master_prompt.length} chars)</summary>
                            <div class="prompt-preview-box">${escapeHtml(p.master_prompt)}</div>
                        </details>
                    </div>

                    <!-- Footer Action -->
                    <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 14px; margin-top: 14px; border-top: 1px solid #1F2937;">
                        <div style="display: flex; gap: 6px;">
                            <button onclick="openEditModal('${p.subcategory_id}', '${escapeJs(p.job_title)}', '${escapeJs(p.job_tool)}')" class="btn-secondary" style="padding: 6px 10px;" title="Edit Prompt">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button onclick="viewVersionHistory('${p.subcategory_id}')" class="btn-secondary" style="padding: 6px 10px;" title="Version History">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                            </button>
                        </div>

                        <button id="btn-gen-${p.subcategory_id}" onclick="generateImageForSubcat('${p.subcategory_id}')" class="btn-primary" style="padding: 7px 14px; font-size: 12px;">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate / Retry
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        async function generateImageForSubcat(subcatId) {
            console.log('⚡ [ADMIN] Triggering image generation for subcategoryId:', subcatId);
            const btnElement = document.getElementById(`btn-gen-${subcatId}`);
            const originalText = btnElement ? btnElement.innerHTML : 'Generate / Retry';
            
            if (btnElement) {
                btnElement.disabled = true;
                btnElement.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Generating...`;
            }

            try {
                const res = await fetch('/api/admin/cms/ai-assets/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subcategoryId: subcatId })
                });

                const data = await res.json();
                console.log('✅ [ADMIN] Generation response:', data);

                if (data.success) {
                    showToast(`Generated asset version v${data.version} successfully!`, 'success');
                    await loadAllPrompts();
                } else {
                    showToast(`Generation output: ${data.message || data.error}`, 'warning');
                    await loadAllPrompts();
                }
            } catch (err) {
                console.error('❌ [ADMIN] Error:', err);
                showToast('Error triggering asset generation', 'error');
            } finally {
                if (btnElement) {
                    btnElement.disabled = false;
                    btnElement.innerHTML = originalText;
                }
            }
        }

        async function triggerBatchRegeneration() {
            const btn = document.getElementById('batchGenBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Processing All...`;

            try {
                const res = await fetch('/api/admin/cms/ai-assets/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                const data = await res.json();
                if (data.success) {
                    showToast(`Batch regeneration complete for ${data.total} categories.`, 'success');
                    await loadAllPrompts();
                }
            } catch (e) {
                showToast('Batch regeneration error', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> Generate All Categories`;
            }
        }

        async function viewVersionHistory(subcatId) {
            const modal = document.getElementById('versionModal');
            const content = document.getElementById('versionModalContent');

            content.innerHTML = `<div style="text-align: center; padding: 20px; color: #9CA3AF;"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading version history...</div>`;
            modal.classList.add('active');

            try {
                const res = await fetch(`/api/admin/cms/ai-assets/versions/${subcatId}`);
                const data = await res.json();

                if (data.success && data.versions.length > 0) {
                    content.innerHTML = data.versions.map(v => `
                        <div style="background: #030712; border: 1px solid #1F2937; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div class="thumb-box" style="width: 54px; height: 54px;">
                                    <img src="${v.image_url}" onerror="this.src='/assets/images/home services/electrical/wiring.webp'">
                                </div>
                                <div>
                                    <h5 style="font-size: 13px; font-weight: 700; color: white;">
                                        Version v${v.version} <span style="font-size: 10px; padding: 2px 6px; border-radius: 10px; background: ${v.approved ? 'rgba(16,185,129,0.2)' : 'rgba(239,68,68,0.2)'}; color: ${v.approved ? '#10B981' : '#EF4444'};">${v.status}</span>
                                    </h5>
                                    <p style="font-size: 11px; color: #9CA3AF; margin-top: 2px;">${new Date(v.created_at).toLocaleString()}</p>
                                    <p style="font-size: 10px; font-family: monospace; color: #6B7280; margin-top: 2px;">${v.image_url}</p>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    content.innerHTML = `<div style="text-align: center; padding: 20px; color: #9CA3AF;">No version history recorded yet.</div>`;
                }
            } catch (err) {
                content.innerHTML = `<div style="text-align: center; padding: 20px; color: #EF4444;">Failed to load version history.</div>`;
            }
        }

        function closeVersionModal() {
            document.getElementById('versionModal').classList.remove('active');
        }

        function openEditModal(subcatId, jobTitle, jobTool) {
            document.getElementById('editSubcatId').value = subcatId;
            document.getElementById('editJobTitle').value = jobTitle;
            document.getElementById('editJobTool').value = jobTool;

            document.getElementById('editPromptModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editPromptModal').classList.remove('active');
        }

        async function saveEditedPrompt() {
            const subcategoryId = document.getElementById('editSubcatId').value;
            const jobTitle = document.getElementById('editJobTitle').value;
            const jobTool = document.getElementById('editJobTool').value;

            try {
                const res = await fetch('/api/admin/cms/ai-assets/prompts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ subcategoryId, jobTitle, jobTool })
                });

                const data = await res.json();
                if (data.success) {
                    showToast('Master prompt updated & locked successfully!', 'success');
                    closeEditModal();
                    await loadAllPrompts();
                } else {
                    showToast(data.error || 'Failed to update prompt', 'error');
                }
            } catch (err) {
                showToast('Network error while saving prompt', 'error');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderColor = type === 'success' ? '#10B981' : (type === 'error' ? '#EF4444' : '#F97316');
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : (type === 'error' ? 'fa-triangle-exclamation' : 'fa-info-circle')}" style="color: ${type === 'success' ? '#10B981' : (type === 'error' ? '#EF4444' : '#F97316')}"></i> <span>${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeJs(str) {
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
